version: "3.9"

# Day 1 development infrastructure only: MongoDB + Redis.
# No application services are containerized yet.

services:
  mongodb:
    image: mongo:7
    container_name: intellmeet-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: intellmeet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
